<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status de errores · Whitelabel</title>
<style>
:root{
  --bg:#F6F5FC; --surface:#FFFFFF; --ink:#1F1B3A; --muted:#6B6A80; --line:#E4E2F0; --brand:#5B3FD9; --brand-ink:#FFFFFF; --soft:#EFECFC;
  --warn:#B45309; --info:#1D4ED8; --ok:#15803D; --na:#475569; --dev:#7C3AED;
  --p-bajo-bg:#DCFCE7; --p-bajo:#15803D; --p-medio-bg:#FEF9C3; --p-medio:#854D0E; --p-alto-bg:#FEE2E2; --p-alto:#B91C1C; --p-critico-bg:#7F1D1D; --p-critico:#FFFFFF;
  --owner-bg:#FFF7E6; --owner-line:#F5C36B; --owner-ink:#7A4A00;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111F; --surface:#1C1930; --ink:#ECEAFB; --muted:#A09EB8; --line:#322E4D; --brand:#8B74F5; --brand-ink:#14102B; --soft:#262244;
    --warn:#FBBF24; --info:#93C5FD; --ok:#86EFAC; --na:#CBD5E1; --dev:#C4B5FD;
    --p-bajo-bg:#0F2E1A; --p-bajo:#86EFAC; --p-medio-bg:#3B3410; --p-medio:#FDE68A; --p-alto-bg:#451A1A; --p-alto:#FCA5A5; --p-critico-bg:#B91C1C; --p-critico:#FFFFFF;
    --owner-bg:#3A2B0C; --owner-line:#8A6414; --owner-ink:#FCD98A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#13111F; --surface:#1C1930; --ink:#ECEAFB; --muted:#A09EB8; --line:#322E4D; --brand:#8B74F5; --brand-ink:#14102B; --soft:#262244;
    --warn:#FBBF24; --info:#93C5FD; --ok:#86EFAC; --na:#CBD5E1; --dev:#C4B5FD;
    --p-bajo-bg:#0F2E1A; --p-bajo:#86EFAC; --p-medio-bg:#3B3410; --p-medio:#FDE68A; --p-alto-bg:#451A1A; --p-alto:#FCA5A5; --p-critico-bg:#B91C1C; --p-critico:#FFFFFF;
    --owner-bg:#3A2B0C; --owner-line:#8A6414; --owner-ink:#FCD98A;
    color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header.hero{background:var(--brand);color:var(--brand-ink);border-radius:0 0 18px 18px;padding:22px 20px 20px;margin:0 -16px 16px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
header.hero h1{margin:0;font-size:1.55rem;line-height:1.2}
header.hero p{margin:4px 0 0;opacity:.85;font-size:.9rem}
.lang{display:flex;border:1.5px solid var(--brand-ink);border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{background:transparent;color:var(--brand-ink);border:0;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
.version{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.version .big{font-size:1.05rem;font-weight:700}
.version .small{color:var(--muted);font-size:.85rem}
.version button{margin-left:auto;background:var(--soft);color:var(--brand);border:0;border-radius:8px;padding:8px 12px;font-weight:600;font-size:.82rem;cursor:pointer;white-space:nowrap}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:.78rem;color:var(--muted)}
.legend b{margin-right:2px}
.help{display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;gap:16px;align-items:flex-start}
.help.open{display:flex}
.help img{width:150px;max-width:40%;border-radius:10px;border:1px solid var(--line)}
.help ol{margin:0;padding-left:18px;font-size:.9rem}
.help li{margin-bottom:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left;min-width:108px}
.tab .n{display:block;font-size:1.3rem;font-weight:800;line-height:1.1}
.tab .l{display:block;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tab[aria-selected="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.tab[aria-selected="true"] .l{color:var(--brand)}
.tab.attn .n{color:var(--info)}
.panel{display:none}
.panel.active{display:block}
.panel-title{margin:10px 0 4px;font-size:1.05rem}
.panel-sub{margin:0 0 12px;color:var(--muted);font-size:.88rem}
.owners{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.owner-chip{display:flex;align-items:center;gap:8px;background:var(--owner-bg);border:1px solid var(--owner-line);color:var(--owner-ink);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:.88rem}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--owner-line);color:#3a2500;display:grid;place-items:center;font-size:.8rem;font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--brand));border-radius:12px;padding:13px 14px;margin-bottom:10px}
.card h3{margin:0;font-size:.98rem;line-height:1.3}
.card .num{color:var(--muted);font-weight:600;margin-right:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.chip.mod{background:var(--soft);color:var(--brand)}
.chip.p-bajo{background:var(--p-bajo-bg);color:var(--p-bajo)}
.chip.p-medio{background:var(--p-medio-bg);color:var(--p-medio)}
.chip.p-alto{background:var(--p-alto-bg);color:var(--p-alto)}
.chip.p-critico{background:var(--p-critico-bg);color:var(--p-critico)}
.meta{margin-top:6px;color:var(--muted);font-size:.78rem}
.card p{margin:8px 0 0;font-size:.9rem}
.lbl{color:var(--brand);font-weight:800;font-size:.7rem;letter-spacing:.04em;margin-right:6px}
details{margin-top:8px;font-size:.84rem;color:var(--muted)}
summary{cursor:pointer;font-weight:600}
details p{margin:6px 0 0;color:var(--ink);font-size:.86rem}
.owner{display:flex;gap:12px;align-items:center;background:var(--owner-bg);border:1px solid var(--owner-line);border-radius:10px;padding:10px 12px;margin-top:10px}
.owner .avatar{width:38px;height:38px;font-size:1.05rem}
.owner .k{font-size:.68rem;font-weight:800;letter-spacing:.05em;color:var(--owner-ink);text-transform:uppercase}
.owner .v{font-size:1.05rem;font-weight:800;color:var(--owner-ink)}
.owner .d{font-size:.8rem;color:var(--owner-ink);opacity:.9}
.note{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:.88rem}
.empty{color:var(--muted);font-size:.9rem;padding:20px 0}
.tools{display:flex;justify-content:flex-end;gap:8px;margin:14px 0 0}
.tools button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer}
footer{color:var(--muted);font-size:.78rem;margin-top:18px}
@media (max-width:520px){.help.open{flex-direction:column}.help img{max-width:60%}.version{flex-wrap:wrap}.version button{margin-left:0}header.hero h1{font-size:1.3rem}}
@media print{
  body{background:#fff;color:#000}
  .tabs,.tools,.version button,.help,.lang{display:none!important}
  .panel{display:block!important}
  .card{break-inside:avoid}
  header.hero,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

var D = R.map(function(r){return {n:r[0],s:r[1],p:r[2],r:r[3],date:r[4],os:r[5],who:r[6],m:r[7],t:r[8],d:r[9],st:r[10],o:r[11]}});

var L = "es", cur = "reportado";
try{ var sv=localStorage.getItem("lang"); if(sv==="es"||sv==="pt") L=sv; else if((navigator.language||"").toLowerCase().indexOf("pt")===0) L="pt"; }catch(e){}
function T(k){return I[L][k]}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function ownName(k){return OWN[k]?OWN[k][L]:k}

function card(x,def){
  var chips='<span class="chip mod">'+esc(x.m[L==="es"?0:1])+'</span>';
  if(x.p) chips+='<span class="chip p-'+x.p+'">'+T("prio")+': '+PL[x.p][L]+'</span>';
  if(x.r && def.key!=="Reportado") chips+='<span class="chip">'+T("resp")+': '+esc(x.r)+'</span>';
  var i=L==="es"?0:1;
  var h='<article class="card" style="--c:'+def.color+'"><h3><span class="num">#'+x.n+'</span>'+esc(x.t[i])+'</h3><div class="chips">'+chips+'</div><div class="meta">'+x.date+'/2026 · '+x.os+' · '+esc(x.who)+'</div>';
  h+='<p>'+esc(x.d[i])+'</p>';
  if(def.key==="Reportado"){
    h+='<div class="owner"><div class="avatar">'+esc(x.r.charAt(0))+'</div><div><div class="k">'+T("dep")+'</div><div class="v">'+esc(ownName(x.r))+'</div><div class="d">'+T("depd")+'</div></div></div>';
    if(x.o) h+='<div class="note"><span class="lbl">'+T("note")+'</span>'+esc(x.o[i])+'</div>';
  } else if(def.key==="No aplica" && x.o){
    h+='<div class="note"><span class="lbl">'+T("why")+'</span>'+esc(x.o[i])+'</div>';
  }
  if(x.st) h+='<details><summary>'+T("steps")+'</summary><p>'+esc(x.st[i])+'</p></details>';
  return h+'</article>';
}

function render(){
  document.documentElement.lang=L;
  document.title=T("title")+" · Whitelabel";
  document.querySelectorAll("[data-i]").forEach(function(el){el.innerHTML=T(el.getAttribute("data-i"))});
  document.getElementById("helpImg").alt=T("imgAlt");
  document.getElementById("lang-es").setAttribute("aria-pressed",L==="es"?"true":"false");
  document.getElementById("lang-pt").setAttribute("aria-pressed",L==="pt"?"true":"false");
  document.getElementById("legend").innerHTML='<b>'+T("lg")+'</b>'+["bajo","medio","alto","critico"].map(function(k){return '<span class="chip p-'+k+'">'+PL[k][L]+'</span>'}).join("");
  var tabs=document.getElementById("tabs"), panels=document.getElementById("panels");
  tabs.innerHTML=""; panels.innerHTML="";
  ST.forEach(function(def){
    var items=D.filter(function(x){return x.s===def.key});
    var b=document.createElement("button");
    b.className="tab"+(def.attn?" attn":""); b.setAttribute("role","tab"); b.id="tab-"+def.id; b.setAttribute("aria-controls","panel-"+def.id);
    b.innerHTML='<span class="n">'+items.length+'</span><span class="l">'+def.label[L]+'</span>';
    b.onclick=function(){show(def.id,true)};
    tabs.appendChild(b);
    var p=document.createElement("section"); p.className="panel"; p.id="panel-"+def.id; p.setAttribute("role","tabpanel"); p.setAttribute("aria-labelledby","tab-"+def.id);
    var h='<h2 class="panel-title">'+def.label[L]+' ('+items.length+')</h2><p class="panel-sub">'+def.sub[L]+'</p>';
    if(def.key==="Reportado"){
      var by={}; items.forEach(function(x){by[x.r]=(by[x.r]||0)+1});
      h+='<div class="owners">'+Object.keys(by).map(function(k){return '<span class="owner-chip"><span class="avatar">'+esc(k.charAt(0))+'</span>'+esc(ownName(k))+' · '+by[k]+'</span>'}).join("")+'</div>';
      items=items.slice().sort(function(a,b){return a.r<b.r?1:(a.r>b.r?-1:0)});
    }
    h+=items.length?items.map(function(x){return card(x,def)}).join(""):'<div class="empty">'+T("empty")+'</div>';
    p.innerHTML=h; panels.appendChild(p);
  });
  show(cur,false);
}
function show(id,push){
  if(!ST.some(function(s){return s.id===id})) id=ST[0].id;
  cur=id;
  ST.forEach(function(s){
    document.getElementById("panel-"+s.id).classList.toggle("active",s.id===id);
    document.getElementById("tab-"+s.id).setAttribute("aria-selected",s.id===id?"true":"false");
  });
  if(push){ try{ if(location.hash!=="#"+id) location.hash=id; }catch(e){} }
}
function setLang(l){ L=l; try{localStorage.setItem("lang",l)}catch(e){} render(); }
window.addEventListener("hashchange",function(){show(location.hash.slice(1),false)});
document.getElementById("lang-es").onclick=function(){setLang("es")};
document.getElementById("lang-pt").onclick=function(){setLang("pt")};
document.getElementById("helpBtn").onclick=function(){
  var h=document.getElementById("help"); var o=h.classList.toggle("open"); this.setAttribute("aria-expanded",o);
};
document.getElementById("printBtn").onclick=function(){window.print()};
cur=location.hash.slice(1)||"reportado";
render();
</script>
